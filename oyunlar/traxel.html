function tx(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;fn(c.getContext("2d"));const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}

const cam=new THREE.PerspectiveCamera(75,1,.05,300);scene.add(cam);
scene.add(new THREE.HemisphereLight(0xcfe6ff,0x4a5a30,.8));
const sun=new THREE.DirectionalLight(0xfff2d0,.85);sun.position.set(30,50,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
const shc=sun.shadow.camera;shc.left=shc.bottom=-52;shc.right=shc.top=52;shc.far=160;scene.add(sun);
{const g=new THREE.SphereGeometry(200,16,12),cl=[],ps=g.attributes.position;for(let i=0;i<ps.count;i++){const t=Math.max(0,ps.getY(i)/200),c=new THREE.Color(0xdcebf7).lerp(new THREE.Color(0x3d7bd0),Math.pow(t,.55));cl.push(c.r,c.g,c.b)}

const grass=tx(16,16,x=>{nz(x,16,16,[84,140,52],40);x.fillStyle="#3f7a2c";for(let i=0;i<14;i++)x.fillRect(Math.random()*16|0,Math.random()*16|0,1,2)});grass.repeat.set(70,70);

const T={wood:tx(16,16,x=>{nz(x,16,16,[150,105,55],30);x.fillStyle="#5a3a18";for(let i=0;i<16;i+=5)x.fillRect(0,i,16,1);x.fillRect(0,0,1,16);x.fillRect(15,0,1,16)}),
 brick:tx(32,16,x=>{nz(x,32,16,[160,75,60],26);x.fillStyle="#c9c0b0";for(let j=0;j<16;j+=4){x.fillRect(0,j,32,1);for(let i=(j/4%2)*4;i<32;i+=8)x.fillRect(i,j,1,4)}}),
 conc:tx(16,16,x=>{nz(x,16,16,[130,132,136],24);x.fillStyle="#6a6c70";x.fillRect(0,0,16,1);x.fillRect(0,0,1,16)}),
 bark:tx(8,8,x=>nz(x,8,8,[100,70,40],36)),leaf:tx(8,8,x=>nz(x,8,8,[50,125,40],70)),hill:tx(8,8,x=>nz(x,8,8,[70,120,60],30))};
const walls=[],boxes=[];

addBox(0,-41,84,1,6,"brick");addBox(0,41,84,1,6,"brick");addBox(-41,0,1,84,6,"brick");addBox(41,0,1,84,6,"brick");

for(let i=0;i<16;i++){const x=(rnd()-.5)*66,z=(rnd()-.5)*66;if(Math.abs(x)<5&&Math.abs(z)<5)continue;

for(let i=0;i<14;i++){const x=(rnd()-.5)*70,z=(rnd()-.5)*70;if(Math.abs(x)<6&&Math.abs(z)<6)continue;
 addBox(x,z,1,1,4,"bark");addBox(x,z,4,2.4,4,"leaf",false).position.y=5.2;addBox(x,z,2.4,1.4,4,"leaf",false).position.y=6.9}
for(let i=0;i<10;i++){const a=i/10*6.283,r=75+rnd()*25,h=10+rnd()*14;addBox(Math.cos(a)*r,Math.sin(a)*r,26,26,h,"hill",false)}
const hit=(x,z)=>boxes.some(b=>Math.abs(x-b.x)<b.hw+.5&&Math.abs(z-b.z)<b.hd+.5)||Math.abs(x)>39||Math.abs(z)>39;
// pickups
const picks=[];[[-15,-15],[15,15],[-15,15],[15,-15],[0,25],[0,-25],[25,0],[-25,0]].forEach((p,i)=>{
 const t=i%2?"ammo":"hp";const m=new THREE.Mesh(new THREE.BoxGeometry(.8,.8,.8),new THREE.MeshLambertMaterial({color:t=="hp"?0x22cc55:0xffcc22,emissive:t=="hp"?0x115522:0x554411}));
 m.position.set(p[0],.7,p[1]);scene.add(m);picks.push({m,t,on:true,at:0})});
// gun model
const gun=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({color:0x333333}));gun.position.set(.25,-.22,-.5);cam.add(gun);
function setW(w){if(!W[w])return;cur=w;reloading=false;const c=W[w];gun.scale.set(...c.sc);gun.material.color.setHex(c.col);gun.position.z=-.3-c.sc[2]/2;
 document.querySelectorAll("[data-w]").forEach(b=>b.classList.toggle("on",b.dataset.w==w));setZoom(false);hud()}
function setZoom(z){zoom=z;cam.fov=z?W[cur].zf:75;cam.updateProjectionMatrix();$("scope").style.display=z&&cur=="sn"?"block":"none";$("cross").style.display=z&&cur=="sn"?"none":"block";gun.visible=!(z&&cur=="sn")}

// ---- network
let room=null;const P={};let lastPres=0;
function mkNet(code){return new Promise((ok,no)=>{if(!window.Peer)return no({type:"nopeer"});
 const L={},pc=[],st={},cs={};let tm=0,up=null;
 const dl=(t,d)=>(L[t]||[]).forEach(f=>f({data:d,isMe:false}));
 const ep=l=>pc.forEach(f=>f({peers:l.map(q=>({isMe:q.id===me.id,presence:q}))}));
 const say=t=>{if(lob)$("cn").textContent=t};
 const R={on(t,f){(L[t]=L[t]||[]).push(f)},onPeers(f){pc.push(f)}};
 const id="arena3d-"+code;
 if(isHost){
  const peer=new Peer(id);
  const push=()=>{if(tm)return;tm=setTimeout(()=>{tm=0;const l=Object.values(st);ep(l);for(const k in cs)cs[k].open&&cs[k].send({t:"peers",l})},70)};
  const fan=(m,x)=>{for(const k in cs)if(cs[k]!==x&&cs[k].open)cs[k].send(m)};
  R.emit=(t,d)=>{fan({t:"ev",topic:t,data:d});return Promise.resolve()};
  R.presence=d=>{st[d.id]=d;push();return Promise.resolve()};
  peer.on("open",()=>ok(R));
  peer.on("error",no);
  peer.on("connection",c=>{cs[c.peer]=c;
   c.on("data",m=>{if(!m)return;if(m.t=="pres"&&m.d&&m.d.id){c.pid=m.d.id;st[c.pid]=m.d;push()}else if(m.t=="ev"){dl(m.topic,m.data);fan(m,c)}});
   c.on("close",()=>{delete cs[c.peer];if(c.pid)delete st[c.pid];push()})});
 }else{
  const peer=new Peer();
  R.emit=(t,d)=>{up&&up.open&&up.send({t:"ev",topic:t,data:d});return Promise.resolve()};
  R.presence=d=>{up&&up.open&&up.send({t:"pres",d});return Promise.resolve()};
  peer.on("error",no);
  peer.on("open",()=>{const c=peer.connect(id,{reliable:true});
   const to=setTimeout(()=>say("Bağlanılamadı – kod doğru mu?"),10000);
   c.on("open",()=>{clearTimeout(to);up=c;say("Bağlandı ✔ Kurucunun başlatması bekleniyor…");ok(R)});
   c.on("data",m=>{if(!m)return;if(m.t=="ev")dl(m.topic,m.data);else if(m.t=="peers")ep(m.l||[])});
   c.on("close",()=>{up=null;say("Bağlantı koptu")})});
 }})}
async function connect(code){GC=code;try{room=await mkNet(code);
 room.onPeers(ch=>{const seen={};ch.peers.forEach(p=>{const q=p.presence;if(p.isMe||!q||!q.id)return;seen[q.id]=1;
  const ky=(q.n||"?")+"|"+(q.t||"");let o=P[q.id];if(!o||o.ky!==ky){const nw=mkPeer(q.id,q.t,q.n||"?");nw.ky=ky;if(o){scene.remove(o.g);nw.g.position.copy(o.g.position)}o=P[q.id]=nw}o.s=q});for(const id in P)if(!seen[id]){scene.remove(P[id].g);delete P[id]}});
 room.on("hit",m=>{const x=m.data;if(!x||x.to!==me.id||!alive||m.isMe||x.tm===myTeam)return;dmg(Math.min(200,+x.dmg||0),x)});
 room.on("start",m=>{const t=m.data&&m.data.teams;if(!lob||!t||!t[me.id])return;begin(t[me.id])});
 room.on("kill",m=>{const x=m.data;if(!x)return;feed(`${x.k} ➜ ${x.v}`);if(!m.isMe&&(x.tm==="red"||x.tm==="blue"))tk[x.tm]++;if(x.by===me.id&&!m.isMe){k++;pres(1)}});pres(1);
 clearInterval(window.hb);window.hb=setInterval(()=>pres(1),1000);
}catch(e){room=null;feed("Çevrimdışı mod");if(lob)$("cn").textContent=e&&e.type=="peer-unavailable"?"Bu kodla grup bulunamadı":"Bağlanılamadı – kodu ve internetini kontrol et"}}
function pres(f){if(!room)return;const n=performance.now();if(!f&&n-lastPres<100)return;lastPres=n;
 room.presence({id:me.id,n:me.name,x:+p.x.toFixed(2),y:+p.y.toFixed(2),z:+p.z.toFixed(2),r:+p.yaw.toFixed(2),h:hp,k,d,w:cur,a:alive?1:0,t:myTeam}).catch(()=>{})}
function tag(n,t){const c=document.createElement("canvas");c.width=256;c.height=64;const x=c.getContext("2d");x.font="bold 34px sans-serif";x.textAlign="center";x.fillStyle="rgba(0,0,0,.55)";x.fillRect(0,8,256,48);x.fillStyle=t=="red"?"#ff5a5a":t=="blue"?"#5aa0ff":"#fff";x.fillText(n,128,46);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),fog:false}));s.scale.set(1.6,.4,1);s.position.y=2.35;return s}

 const sk=[224,172,140],c=new THREE.Color(team==="red"?0xd62828:team==="blue"?0x2456d6:0x777777),sh=[c.r*255,c.g*255,c.b*255],hr="#46301a";

 const face=tx(8,8,x=>{nz(x,8,8,sk,12);x.fillStyle=hr;x.fillRect(0,0,8,2);x.fillStyle="#fff";x.fillRect(1,3,2,1);x.fillRect(5,3,2,1);x.fillStyle="#3a4fd0";x.fillRect(2,3,1,1);x.fillRect(5,3,1,1);x.fillStyle="#8a4a3a";x.fillRect(3,6,2,1)});
 const head=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.5),[lm(side),lm(side),lm(top),lm(side),lm(top),lm(face)]);head.position.y=1.75;head.userData={id,head:1};

 const aR=limb(.25,armT,.375,1.5),aL=limb(.25,armT,-.375,1.5),lt=tx(4,12,x=>nz(x,4,12,[50,60,140],16)),l1=limb(.25,lt,.125,.75),l2=limb(.25,lt,-.125,.75);

  if(keys[" "]&&p.y==0)p.vy=7;p.vy-=22*dt;p.y=Math.max(0,p.y+p.vy*dt);if(p.y==0)p.vy=0;

  o.g.position.x+=(sx-o.g.position.x)*t;o.g.position.y+=((s.y||0)-o.g.position.y)*t;o.g.position.z+=(sz-o.g.position.z)*t;o.g.rotation.y+=((s.r||0)-o.g.rotation.y)*t}}
